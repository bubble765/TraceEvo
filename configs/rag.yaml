# Current RAG layout. Runtime CLI defaults are defined in gos/main.py.
rag:
  patient_evidence:
    enabled: true
    store: sqlite
    database_path: traceevo_runs/rag/patient_evidence.sqlite3
    vector_search: false
    default_limit: 20
    max_limit: 100

  medical_knowledge:
    enabled: true
    vector_db: qdrant
    storage_path: traceevo_runs/rag/qdrant_v5
    collection: traceevo_medical_knowledge_v5
    index: hnsw
    distance: cosine
    document_candidate_k: 5
    child_candidates_per_document: 4
    min_reranker_score: null
    final_k: 4
    ingestion:
      raw_dir: traceevo_runs/rag/medical_knowledge/raw
      normalized_dir: traceevo_runs/rag/medical_knowledge/normalized/schema-v5
      normalized_schema: schema-v5
      pmc_adapter: ncbi_bioc_json
      who_adapter: explicit_manifest_only
      who_manifest: null
      allow_noncommercial: false

  experience:
    enabled: false
    vector_db: qdrant
    collection: traceevo_experience
    index: hnsw
    distance: cosine
    retrieve_k: 20
    rerank_k: 5
    final_k: 2

  embedding:
    model: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    dimension: 1024
    edge_candidate_dimension: 512
    normalize: true
    device: auto
    batch_size: 4

  reranker:
    model: Qwen/Qwen3-Reranker-0.6B

  chunking:
    target_tokens: 384
    max_tokens: 480
    overlap_tokens: 0
    tail_merge_max_tokens: 96
    tokenizer: Qwen/Qwen3-Embedding-0.6B

  query_planning:
    max_subqueries: 4
    always_reformulate: true

  integration:
    core_v1_hook_enabled: false
    legacy_evidence_retriever_unchanged: true
    legacy_evidence_retriever_mode: legacy
