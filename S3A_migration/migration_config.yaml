# S3A blind migration audit configuration (S3A §2, §6)
#
# Written before the first holdout case was run and not edited afterwards.
# The data split is frozen here because §2 freezes it: "S3A 只能读取/运行 case
# 10-29. 不得读取 case 30-137."

data_split:
  dev_small:
    cases: "0-9"
    role: "regression and replay only; already used for S0-S2"
    used_in_s3a_for: "the §8 non-invasiveness regression and the A4 recheck"
  migration_holdout:
    cases: "10-29"
    role: "S3A blind migration audit"
    rule: "no audit rule, threshold or regex may be changed before the first migration report is written"
  dev_evolve:
    cases: "30-49"
    role: "future S3B/S4"
    touched_in_s3a: false
  validation:
    cases: "50-69"
    role: "future threshold/hyperparameter selection"
    touched_in_s3a: false
  held_out_test:
    cases: "70-137"
    role: "S5, after the method is frozen"
    touched_in_s3a: false

migration:
  holdout_cases: "10-29"
  backbone: "deepseek-v4-flash"          # fixed for all phases; never changed mid-run
  replay_mode: "off"                     # live calls: this is new data, not a replay
  ledger: true                           # §6.2 needs uncommitted-call and discard rates
  provenance: true
  tag: "migration_holdout"

# §6.2: what the first pass reports. Note the wording -- an alert on a new case
# is not known to be a false positive, so the FPR name is not used.
report:
  - clean_trace_alert_rate
  - evidence_alert_rate
  - p0_p1_p2_p3_distribution
  - externally_grounded_rate
  - lineage_complete_rate
  - uncommitted_call_rate
  - degraded_failed_call_rate
  - decision_content_discard_rate

# §7: thresholds that mean "return this for review", never "adjust the rules".
# Exceeding one does not stop the audit and does not license a code change.
review_flags:
  clean_trace_alert_rate_above: 0.25
  p3_rate_above: 0.10
  on_exceed: "mark NEED_REVIEW and hand the review queue back; do not tune"

# §7 forbids a "migration F1 >= X" gate. There is no gold label on case 10-29,
# so any such number would be invented precision.
gates:
  migration_f1_threshold: null
  rationale: "no human gold labels on the holdout; a threshold would be pseudo-precision"

rule_freeze:
  manifest: "rule_freeze_manifest.json"
  verified_after_the_run: true
