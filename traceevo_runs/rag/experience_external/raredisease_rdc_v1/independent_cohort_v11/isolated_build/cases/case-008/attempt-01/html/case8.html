<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Graph Visualization</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        signal: '#ef4444',
                        evidence: '#22c55e',
                        hypothesis: '#f97316',
                        background: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .node-card {
                @apply p-3 rounded-lg shadow-md transition-all duration-300 cursor-pointer;
            }
            .node-card:hover {
                @apply shadow-lg transform -translate-y-1;
            }
            .signal-node {
                @apply bg-red-100 border-l-4 border-signal;
            }
            .evidence-node {
                @apply bg-green-100 border-l-4 border-evidence;
            }
            .hypothesis-node {
                @apply bg-orange-100 border-l-4 border-hypothesis;
            }
            .nav-button {
                @apply px-4 py-2 rounded-md bg-primary text-white hover:bg-blue-600 transition-colors duration-200;
            }
            .nav-button:disabled {
                @apply bg-gray-300 cursor-not-allowed;
            }
            .tooltip {
                @apply absolute bg-white p-2 rounded shadow-lg z-50 max-w-xs;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.2s;
            }
        }
    </style>
</head>
<body class="bg-background min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Causal graph</h1>
            <p class="text-gray-600">Causal graph</p>
        </header>

        <div class="flex flex-col lg:flex-row gap-6">

            <div class="lg:w-1/4 bg-white p-4 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Navi</h2>
                <div class="flex justify-between items-center mb-6">
                    <button id="prevBtn" class="nav-button">
                        <i class="fa fa-arrow-left mr-2"></i>Before
                    </button>
                    <span id="counter" class="text-lg font-medium text-gray-700">1 / 9</span>
                    <button id="nextBtn" class="nav-button">
                        Next<i class="fa fa-arrow-right ml-2"></i>
                    </button>
                </div>
                
                <div class="mb-6">
                    <h3 class="text-lg font-medium mb-2 text-gray-700">Legend</h3>
                    <div class="space-y-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-signal mr-2"></div>
                            <span>Signal (Signal)</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-evidence mr-2"></div>
                            <span>Evidence (Evidence)</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-hypothesis mr-2"></div>
                            <span>Hypothesis (Hypothesis)</span>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h3 class="text-lg font-medium mb-2 text-gray-700">statis</h3>
                    <div id="nodeStats" class="text-sm text-gray-600">
                    </div>
                </div>
            </div>
            
            <div class="lg:w-3/4 bg-white p-4 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="graphTitle" class="text-xl font-semibold text-gray-700">Causal graph 1</h2>
                    <div>
                        <button id="zoomInBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 mr-2">
                            <i class="fa fa-search-plus"></i>
                        </button>
                        <button id="zoomOutBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 mr-2">
                            <i class="fa fa-search-minus"></i>
                        </button>
                        <button id="resetZoomBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">
                            <i class="fa fa-refresh"></i>
                        </button>
                    </div>
                </div>
                

                <div id="graphContainer" class="border border-gray-200 rounded-lg h-[600px] overflow-hidden">
   
                </div>
                
       
                <div id="nodeDetails" class="mt-4 p-4 border border-gray-200 rounded-lg hidden">
                    <h3 class="text-lg font-medium mb-2 text-gray-700">Node</h3>
                    <div id="nodeDetailsContent">
                      
                    </div>
                </div>
            </div>
        </div>
    </div>
    

    <div id="tooltip" class="tooltip"></div>

el": "Skin biopsy shows no granulomas", "score": 1.0, "attrs": {}}, "node-12": {"type": "Evidence", "label": "Skin biopsy shows dense perivascular and periadnexal CD4+ T-cell infiltrate", "score": 1.0, "attrs": {}}, "node-13": {"type": "Evidence", "label": "Immunohistochemistry is positive for CD20, CD43, CD68, and CD1a", "score": 1.0, "attrs": {}}, "node-14": {"type": "Evidence", "label": "Ki-67 proliferation index is 10%", "score": 1.0, "attrs": {}}, "node-15": {"type": "Evidence", "label": "PAS, AFB, CD123, CD56, and GB stains are negative", "score": 1.0, "attrs": {}}, "node-16": {"type": "Evidence", "label": "TCR gene rearrangement analysis shows no clonal peaks", "score": 1.0, "attrs": {}}, "node-17": {"type": "Hypothesis", "label": "Reactive pseudolymphoma/cutaneous lymphoid hyperplasia", "score": 0.62, "attrs": {"why": "The pathologist now explicitly states that current findings most support Jessner lymphocytic infiltration (T-cell cutaneous pseudolymphoma), a subtype within reactive pseudolymphoma/cutaneous lymphoid hyperplasia. The dense perivascular/periadnexal CD4+ T-cell infiltrate with mixed CD20/CD43/CD68/CD1a positivity, low Ki-67 of 10%, absent TCR clonality, and negative PAS/AFB/CD123/CD56/GB all favor a persistent reactive lymphoid process rather than infection, granulomatous disease, or malignancy. Confidence increased from 0.58 to 0.62 because expert consensus has strengthened, while sinonasal/lymph node biopsy remains pending.", "level": 1}}, "node-18": {"type": "Evidence", "label": "Sinonasal and lymph node biopsy and systemic lymphoma staging have not yet been performed", "score": 1.0, "attrs": {}}, "node-19": {"type": "Hypothesis", "label": "Jessner lymphocytic infiltration of the skin (T-cell cutaneous pseudolymphoma)", "score": 0.55, "attrs": {"why": "The pathologist explicitly prioritizes Jessner lymphocytic infiltration as the most supported diagnosis. Chronic facial erythematous papules/plaques, dense perivascular/periadnexal CD4+ T-cell infiltrate, absent TCR clonality, no granulomas, and negative infectious/malignant markers fit this T-cell pseudolymphoma subtype. Confidence increased from 0.40 to 0.55.", "level": 1}}, "node-20": {"type": "Hypothesis", "label": "Jessner lymphocytic infiltration of the skin (T-cell cutaneous pseudolymphoma)", "score": 0.58, "attrs": {"why": "As the granular refinement of reactive pseudolymphoma, Jessner lymphocytic infiltration gains further support from the pathologist's explicit statement that current evidence most favors it, together with the CD4+ T-cell-rich perivascular/periadnexal infiltrate, low Ki-67, and absent TCR clonality. Confidence increased from 0.45 to 0.58, though it remains limited by pending confirmatory workup.", "level": 2}}, "node-21": {"type": "Hypothesis", "label": "Lymphocytoma cutis (B-cell cutaneous pseudolymphoma)", "score": 0.05, "attrs": {"why": "The pathologist explicitly favors a T-cell pseudolymphoma (Jessner), making B-cell pseudolymphoma (lymphocytoma cutis) even less likely despite admixed CD20+ cells. Confidence reduced from 0.08 to 0.05.", "level": 2}}, "node-22": {"type": "Hypothesis", "label": "Reactive cutaneous lymphoid hyperplasia secondary to chronic sinonasal/ethmoidal inflammation", "score": 0.15, "attrs": {"why": "Maxillary CT shows right frontal/ethmoidal sinusitis and sinonasal soft-tissue thickening (node-6), providing a plausible chronic inflammatory trigger that could drive a reactive lymphoid hyperplasia\u2014a specific etiologic refinement of the broad pseudolymphoma frontier.", "level": 2}}, "node-23": {"type": "Hypothesis", "label": "Idiopathic cutaneous lymphoid hyperplasia (no identifiable trigger)", "score": 0.28, "attrs": {"why": "No identifiable trigger is found\u2014Borrelia serology negative (node-5), PAS/AFB negative (node-15), and no drug or autoimmune cause\u2014so an idiopathic reactive lymphoid hyperplasia remains a valid, more specific refinement of the current frontier.", "level": 2}}, "node-24" ll pseudolymphoma (lymphocytoma cutis) even less likely despite admixed CD20+ cells. Confidence reduced from 0.08 to 0.05.", "level": 2}}, "node-22": {"type": "Hypothesis", "label": "Reactive cutaneous lymphoid hyperplasia secondary to chronic sinonasal/ethmoidal inflammation", "score": 0.15, "attrs": {"why": "Maxillary CT shows right frontal/ethmoidal sinusitis and sinonasal soft-tissue thickening (node-6), providing a plausible chronic inflammatory trigger that could drive a reactive lymphoid hyperplasia\u2014a specific etiologic refinement of the broad pseudolymphoma frontier.", "level": 2}}, "node-23": {"type": "Hypothesis", "label": "Idiopathic cutaneous lymphoid hyperplasia (no identifiable trigger)", "score": 0.28, "attrs": {"why": "No identifiable trigger is found\u2014Borrelia serology negative (node-5), PAS/AFB negative (node-15), and no drug or autoimmune cause\u2014so an idiopathic reactive lymphoid hyperplasia remains a valid, more specific refinement of the current frontier.", "level": 2}}, "node-24": {"type": "Evidence", "label": "Pathologist notes DIF and ANA/anti-Ro/anti-La testing for lupus tumidus have not been returned", "score": 1.0, "attrs": {}}, "node-25": {"type": "Evidence", "label": "Pathologist states malignant lymphoproliferative disease is unlikely with current pathology", "score": 1.0, "attrs": {}}, "node-26": {"type": "Evidence", "label": "Pathologist states current findings most support Jessner lymphocytic infiltration (T-cell cutaneous pseudolymphoma)", "score": 1.0, "attrs": {}}, "node-27": {"type": "Hypothesis", "label": "Lupus tumidus (cutaneous lupus erythematosus)", "score": 0.1, "attrs": {"why": "The pathologist identifies lupus tumidus as a key differential requiring pending DIF and ANA/anti-Ro/anti-La; chronic facial erythematous papules/plaques and dense perivascular/periadnexal CD4+ T-cell infiltrate can be seen in lupus tumidus. However, prior negative autoimmune serology/DIF, absence of granulomas, and the pathologist's s ": "node-15", "dst": "node-17", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-17", "type": "support", "attrs": {}}, {"src": "node-1", "dst": "node-19", "type": "refines", "attrs": {}}, {"src": "node-12", "dst": "node-19", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-19", "type": "support", "attrs": {}}, {"src": "node-11", "dst": "node-19", "type": "support", "attrs": {}}, {"src": "node-17", "dst": "node-19", "type": "support", "attrs": {}}, {"src": "node-18", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-17", "dst": "node-20", "type": "refines", "attrs": {}}, {"src": "node-17", "dst": "node-21", "type": "refines", "attrs": {}}, {"src": "node-17", "dst": "node-22", "type": "refines", "attrs": {}}, {"src": "node-17", "dst": "node-23", "type": "refines", "attrs": {}}, {"src": "node-1", "dst": "node-27", "type": "refines", "attrs": {}}, {"src": "node-24", "dst": "node-27", "type": "support", "attrs": {}}, {"src": "node-24", "dst": "node-9", "type": "support", "attrs": {}}, {"src": "node-25", "dst": "node-8", "type": "refute", "attrs": {}}, {"src": "node-26", "dst": "node-17", "type": "support", "attrs": {}}, {"src": "node-26", "dst": "node-19", "type": "support", "attrs": {}}, {"src": "node-26", "dst": "node-20", "type": "support", "attrs": {}}, {"src": "node-4", "dst": "node-27", "type": "support", "attrs": {}}, {"src": "node-12", "dst": "node-27", "type": "support", "attrs": {}}, {"src": "node-5", "dst": "node-27", "type": "refute", "attrs": {}}], "start_signal_id": null}];
        let currentGraphIndex = 0;
        let svg, g, simulation, link, node;
        let width, height;
        let zoom;
        
       
        document.addEventListener('DOMContentLoaded', function() {
            initGraph();
            updateNavigation();
            updateNodeStats();
            setupEventListeners();
        });
        
       
        function initGraph() {
            const container = document.getElementById('graphContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
         
            svg = d3.select('#graphContainer')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
      
            zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', function(event) {
                    g.attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
      
            g = svg.append('g');
            
         
            loadGraph(currentGraphIndex);
        }
        
      
        function loadGraph(index) {
            const graph = graphData[index];
            
       
            document.getElementById('graphTitle').textContent = 'Causal graph ' + (index + 1);
            
      
            g.selectAll('*').remove();
            
       
            const nodes = [];
            for (const nodeId in graph.nodes) {
                if (graph.nodes.hasOwnProperty(nodeId)) {
                    nodes.push({
                        id: nodeId,
                        ...graph.nodes[nodeId]
                    });
                }
            }
            
 
            let links = (graph.edges || []).map(function(e) {
                return {
                    source: e.source || e.src,
                    target: e.target || e.dst,
                    type: e.type,
                    attrs: e.attrs || {}
                };
            });
            
           
            links = links.filter(function(link) {
                const sourceExists = nodes.some(function(n) { return n.id === link.source; });
                const targetExists = nodes.some(function(n) { return n.id === link.target; });
                
                if (!sourceExists) {
                    console.warn('Source node not found:', link.source);
                }
                if (!targetExists) {
                    console.warn('Target node not found:', link.target);
                }
                
                return sourceExists && targetExists;
            });
            
         
            simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(function(d) { return d.id; }).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(70));
            
  
            link = g.append('g')
                .attr('class', 'links')
                .selectAll('line')
                .data(links)
                .enter()
                .append('line')
                .attr('stroke-width', 2)
                .attr('stroke', function(d) { return getLinkColor(d.type); })
                .attr('stroke-opacity', 0.6);
            
  
            const nodeGroups = g.append('g')
                .attr('class', 'nodes')
                .selectAll('.node-group')
                .data(nodes)
                .enter()
                .append('g')
                .attr('class', 'node-group')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
    
            nodeGroups.append('circle')
                .attr('r', 20)
                .attr('fill', function(d) { return getNodeColor(d.type); })
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
        
            nodeGroups.append('text')
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .attr('fill', '#fff')
                .attr('font-size', '12px')
                .text(function(d) { return getNodeIcon(d.type); });
     
            nodeGroups.append('text')
                .attr('dy', 40)
                .attr('text-anchor', 'middle')
                .attr('fill', '#333')
                .attr('font-size', '12px')
                .text(function(d) { return truncateText(d.label, 20); });
            

            nodeGroups.on('click', showNodeDetails);
            
  
            nodeGroups.on('mouseover', function(event, d) {
                const tooltip = d3.select('#tooltip');
                tooltip.transition()
                    .duration(200)
                    .style('opacity', .9);
                tooltip.html(
                    '<div class="font-medium">' + d.type + ': ' + truncateText(d.label, 50) + '</div>' +
                    (d.score !== undefined ? '<div>Score: ' + d.score + '</div>' : '')
                )
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 28) + 'px');
            })
            .on('mouseout', function() {
                d3.select('#tooltip').transition()
                    .duration(500)
                    .style('opacity', 0);
            });
            
     
            simulation.on('tick', function() {
                link
                    .attr('x1', function(d) { return d.source.x; })
                    .attr('y1', function(d) { return d.source.y; })
                    .attr('x2', function(d) { return d.target.x; })
                    .attr('y2', function(d) { return d.target.y; });
                
                nodeGroups
                    .attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
            });
        }
        
 
        function getLinkColor(type) {
            switch(type) {
                case 'support': return '#22c55e'; 
                case 'refute': return '#ef4444'; 
                default: return '#999';
            }
        }

        function getNodeColor(type) {
            switch(type) {
                case 'Signal': return '#ef4444';
                case 'Evidence': return '#22c55e'; 
                case 'Hypothesis': return '#f97316'; 
                default: return '#64748b'; 
            }
        }
        

        function getNodeIcon(type) {
            switch(type) {
                case 'Signal': return 'S';
                case 'Evidence': return 'E';
                case 'Hypothesis': return 'H';
                default: return '?';
            }
        }
        

        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }
        

        function showNodeDetails(event, d) {
            const detailsPanel = document.getElementById('nodeDetails');
            const detailsContent = document.getElementById('nodeDetailsContent');
            
       
            let html = '<div class="mb-2"><span class="font-medium">Type:</span><span class="px-2 py-1 rounded text-white" style="background-color: ' + getNodeColor(d.type) + '">' + d.type + '</span></div>';
            html += '<div class="mb-2"><span class="font-medium"Label:</span><p class="mt-1">' + d.label + '</p></div>';
            
          
            if (d.score !== undefined) {
                html += '<div class="mb-2"><span class="font-medium">Confidence:</span><span>' + d.score + '</span></div>';
            }
            
           
            if (d.attrs && Object.keys(d.attrs).length > 0) {
                html += '<div class="mb-2"><span class="font-medium">Attributes:</span><ul class="mt-1">';
                
                for (const [key, value] of Object.entries(d.attrs)) {
                    html += '<li><span class="font-medium">' + key + ':</span> ' + value + '</li>';
                }
                
                html += '</ul></div>';
            }
            
            detailsContent.innerHTML = html;
            detailsPanel.classList.remove('hidden');
        }
        

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('counter');
            
            prevBtn.disabled = currentGraphIndex === 0;
            nextBtn.disabled = currentGraphIndex === graphData.length - 1;
            counter.textContent = (currentGraphIndex + 1) + ' / ' + graphData.length;
        }
        

        function updateNodeStats() {
            const graph = graphData[currentGraphIndex];
            const nodes = graph.nodes;
            
            let signalCount = 0;
            let evidenceCount = 0;
            let hypothesisCount = 0;
            
            for (const nodeId in nodes) {
                const node = nodes[nodeId];
                switch(node.type) {
                    case 'Signal': signalCount++; break;
                    case 'Evidence': evidenceCount++; break;
                    case 'Hypothesis': hypothesisCount++; break;
                }
            }
            
            const statsHtml = '<div class="mb-1">Total nodes: ' + Object.keys(nodes).length + '</div>' +
                             '<div class="mb-1">Signal Node: ' + signalCount + '</div>' +
                             '<div class="mb-1">Evidence Node: ' + evidenceCount + '</div>' +
                             '<div>Hypothesis Node: ' + hypothesisCount + '</div>';
            
            document.getElementById('nodeStats').innerHTML = statsHtml;
        }
        
        function setupEventListeners() {

            document.getElementById('prevBtn').addEventListener('click', function() {
                if (currentGraphIndex > 0) {
                    currentGraphIndex--;
                    loadGraph(currentGraphIndex);
                    updateNavigation();
                    updateNodeStats();
                    document.getElementById('nodeDetails').classList.add('hidden');
                }
            });
            
            document.getElementById('nextBtn').addEventListener('click', function() {
                if (currentGraphIndex < graphData.length - 1) {
                    currentGraphIndex++;
                    loadGraph(currentGraphIndex);
                    updateNavigation();
                    updateNodeStats();
                    document.getElementById('nodeDetails').classList.add('hidden');
                }
            });
            
  
            document.getElementById('zoomInBtn').addEventListener('click', function() {
                svg.transition().call(zoom.scaleBy, 1.3);
            });
            
            document.getElementById('zoomOutBtn').addEventListener('click', function() {
                svg.transition().call(zoom.scaleBy, 0.7);
            });
            
            document.getElementById('resetZoomBtn').addEventListener('click', function() {
                svg.transition().call(zoom.transform, d3.zoomIdentity);
            });
       
            window.addEventListener('resize', function() {
                const container = document.getElementById('graphContainer');
                width = container.clientWidth;
                height = container.clientHeight;
                
                svg.attr('width', width).attr('height', height);
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.alpha(0.3).restart();
            });
        }
        
  
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
