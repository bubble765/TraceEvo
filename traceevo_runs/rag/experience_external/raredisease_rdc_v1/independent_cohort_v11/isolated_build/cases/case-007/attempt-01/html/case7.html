<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Graph Visualization</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        signal: '#ef4444',
                        evidence: '#22c55e',
                        hypothesis: '#f97316',
                        background: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .node-card {
                @apply p-3 rounded-lg shadow-md transition-all duration-300 cursor-pointer;
            }
            .node-card:hover {
                @apply shadow-lg transform -translate-y-1;
            }
            .signal-node {
                @apply bg-red-100 border-l-4 border-signal;
            }
            .evidence-node {
                @apply bg-green-100 border-l-4 border-evidence;
            }
            .hypothesis-node {
                @apply bg-orange-100 border-l-4 border-hypothesis;
            }
            .nav-button {
                @apply px-4 py-2 rounded-md bg-primary text-white hover:bg-blue-600 transition-colors duration-200;
            }
            .nav-button:disabled {
                @apply bg-gray-300 cursor-not-allowed;
            }
            .tooltip {
                @apply absolute bg-white p-2 rounded shadow-lg z-50 max-w-xs;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.2s;
            }
        }
    </style>
</head>
<body class="bg-background min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Causal graph</h1>
            <p class="text-gray-600">Causal graph</p>
        </header>

        <div class="flex flex-col lg:flex-row gap-6">

            <div class="lg:w-1/4 bg-white p-4 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Navi</h2>
                <div class="flex justify-between items-center mb-6">
                    <button id="prevBtn" class="nav-button">
                        <i class="fa fa-arrow-left mr-2"></i>Before
                    </button>
                    <span id="counter" class="text-lg font-medium text-gray-700">1 / 9</span>
                    <button id="nextBtn" class="nav-button">
                        Next<i class="fa fa-arrow-right ml-2"></i>
                    </button>
                </div>
                
                <div class="mb-6">
                    <h3 class="text-lg font-medium mb-2 text-gray-700">Legend</h3>
                    <div class="space-y-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-signal mr-2"></div>
                            <span>Signal (Signal)</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-evidence mr-2"></div>
                            <span>Evidence (Evidence)</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-hypothesis mr-2"></div>
                            <span>Hypothesis (Hypothesis)</span>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h3 class="text-lg font-medium mb-2 text-gray-700">statis</h3>
                    <div id="nodeStats" class="text-sm text-gray-600">
                    </div>
                </div>
            </div>
            
            <div class="lg:w-3/4 bg-white p-4 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="graphTitle" class="text-xl font-semibold text-gray-700">Causal graph 1</h2>
                    <div>
                        <button id="zoomInBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 mr-2">
                            <i class="fa fa-search-plus"></i>
                        </button>
                        <button id="zoomOutBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 mr-2">
                            <i class="fa fa-search-minus"></i>
                        </button>
                        <button id="resetZoomBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">
                            <i class="fa fa-refresh"></i>
                        </button>
                    </div>
                </div>
                

                <div id="graphContainer" class="border border-gray-200 rounded-lg h-[600px] overflow-hidden">
   
                </div>
                
       
                <div id="nodeDetails" class="mt-4 p-4 border border-gray-200 rounded-lg hidden">
                    <h3 class="text-lg font-medium mb-2 text-gray-700">Node</h3>
                    <div id="nodeDetailsContent">
                      
                    </div>
                </div>
            </div>
        </div>
    </div>

. Confidence is decreased from 0.08 to 0.05.", "level": 1}}, "node-8": {"type": "Hypothesis", "label": "Non-neoplastic bone lesion", "score": 0.1, "attrs": {"why": "Pathologist and Radiologist both state a non-neoplastic bone lesion is unlikely. The atypical vasoforming proliferation, vascular marker positivity, elevated Ki-67, and infiltration into muscle/fat refute a non-neoplastic lesion; confidence is decreased from 0.12 to 0.10.", "level": 1}}, "node-9": {"type": "Evidence", "label": "Biopsy shows atypical vasoforming proliferation with ERG, CD31, and CD34 positivity", "score": 1.0, "attrs": {}}, "node-10": {"type": "Evidence", "label": "Biopsy shows pericytic markers myo1B, CD146, and SMA positivity and is negative for D2-40, CAMTA1, TFE3, and FOSB", "score": 1.0, "attrs": {}}, "node-11": {"type": "Evidence", "label": "Ki-67 proliferation index in biopsy is approximately 16.1% and 10.6%", "score": 1.0, "attrs": {}}, "node-12": {"type": "Evidence", "label": "Biopsy specimen shows infiltration into surrounding muscle and fat", "score": 1.0, "attrs": {}}, "node-13": {"type": "Hypothesis", "label": "Cervical spine vascular neoplasm", "score": 0.82, "attrs": {"why": "Pathologist analysis explicitly favors a cervical spine vascular neoplasm and describes the biopsy as an atypical vasoforming proliferation with endothelial ERG/CD31/CD34 positivity and pericytic myo1B/CD146/SMA positivity. This direct concordance slightly increases confidence from 0.80 to 0.82.", "level": 1}}, "node-14": {"type": "Evidence", "label": "Pathologist recommends tumor subtyping with oncology and spine surgery correlation", "score": 1.0, "attrs": {}}, "node-15": {"type": "Evidence", "label": "Radiologist recommends contrast-enhanced MRI/MRA to assess vascular supply and multidisciplinary management", "score": 1.0, "attrs": {}}, "node-16": {"type": "Hypothesis", "label": "Cervical spine vascular neoplasm with locally aggressive behavior", "score": 0.68, "attrs": {"why": "Pathologist emphasizes Ki-67 10.6\u201316.1% and infiltration into muscle/fat, which support locally aggressive behavior of the vascular neoplasm. Combined with the osteolytic C3-7 mass compressing the cord, confidence is increased from 0.65 to 0.68.", "level": 1}}, "node-17": {"type": "Hypothesis", "label": "Cervical spine angiosarcoma (malignant vascular neoplasm)", "score": 0.62, "attrs": {"why": "Pathologist analysis states angiosarcoma is the leading diagnosis, based on atypical vasoforming cells, ERG/CD31/CD34 positivity, myo1B/CD146/SMA-positive pericytes, Ki-67 10.6\u201316.1%, and infiltration into muscle/fat. These features support a malignant vascular neoplasm and refine the broad vascular neoplasm hypothesis. Confidence is increased from 0.35 to 0.62, but remains below certainty because MYC/TP53 molecular testing, resection details, molecular panel, HIV/HHV-8 status, and MRI/MRA are still missing.", "level": 2}}, "node-18": {"type": "Hypothesis", "label": "Cervical spine epithelioid hemangioendothelioma", "score": 0.05, "attrs": {"why": "Pathologist reports that negative EHE markers exclude epithelioid hemangioendothelioma. This is consistent with the already negative CAMTA1/TFE3 findings and directly lowers the likelihood of EHE as an alternative vascular subtype, reducing confidence from 0.18 to 0.05.", "level": 2}}, "node-19": {"type": "Hypothesis", "label": "Aggressive cervical vertebral hemangioma", "score": 0.12, "attrs": {"why": "Vertebral hemangioma is the most common vascular lesion of the spine, and node-4 shows an osteolytic C3-7 mass with early-phase contrast staining; yet the biopsy atypia (node-9) and elevated Ki-67 (node-11) argue against a simple benign hemangioma, so this is a low-probability refinement of the frontier.", "level": 2}}, "node-20": {"type": "Hypothesis", "label": "Cervical spine hemangioblastoma", "score": 0.08, "attrs": {"why": "A vascular neoplasm that can arise in the spine and would fit the frontier, but node-10 shows D2-40 negativity and         function initGraph() {
            const container = document.getElementById('graphContainer');

            svg = d3.select('#graphContainer')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
      
            zoom = d3.zoom()

            svg.call(zoom);

        }
        
      
        function loadGraph(index) {
            const graph = graphData[index];
            
       
            document.getElementById('graphTitle').textContent = 'Causal graph ' + (index + 1);
            
      
            g.selectAll('*').remove();
            
       
            const nodes = [];
            for (const nodeId in graph.nodes) {
                if (graph.nodes.hasOwnProperty(nodeId)) {
                    nodes.push({
                        id: nodeId,
                        ...graph.nodes[nodeId]
                    });
                }
            }
            
 
            let links = (graph.edges || []).map(function(e) {
                return {
                    source: e.source || e.src,
                    target: e.target || e.dst,
                    type: e.type,
                    attrs: e.attrs || {}
                };
            });
            
           
            links = links.filter(function(link) {
                const sourceExists = nodes.some(function(n) { return n.id === link.source; });
                const targetExists = nodes.some(function(n) { return n.id === link.target; });
                
                if (!sourceExists) {
                    console.warn('Source node not found:', link.source);
                }
                if (!targetExists) {
                    console.warn('Target node not found:', link.target);
                }
                
                return sourceExists && targetExists;
            });
            
         
            simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(function(d) { return d.id; }).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(70));
            
  
            link = g.append('g')
                .attr('class', 'links')
                .selectAll('line')
                .data(links)
                .enter()
                .append('line')
                .attr('stroke-width', 2)
                .attr('stroke', function(d) { return getLinkColor(d.type); })
                .attr('stroke-opacity', 0.6);

            switch(type) {
                case 'Signal': return '#ef4444';
                case 'Evidence': return '#22c55e'; 
                case 'Hypothesis': return '#f97316'; 
                default: return '#64748b'; 
            }
        }
        

        function getNodeIcon(type) {
            switch(type) {
                case 'Signal': return 'S';
                case 'Evidence': return 'E';
                case 'Hypothesis': return 'H';
                default: return '?';
            }
        }
        

        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }
        

        function showNodeDetails(event, d) {
            const detailsPanel = document.getElementById('nodeDetails');
            const detailsContent = document.getElementById('nodeDetailsContent');
            
       
            let html = '<div class="mb-2"><span class="font-medium">Type:</span><span class="px-2 py-1 rounded text-white" style="background-color: ' + getNodeColor(d.type) + '">' + d.type + '</span></div>';
            html += '<div class="mb-2"><span class="font-medium"Label:</span><p class="mt-1">' + d.label + '</p></div>';
            
          
            if (d.score !== undefined) {
                html += '<div class="mb-2"><span class="font-medium">Confidence:</span><span>' + d.score + '</span></div>';
            }
            
           
            if (d.attrs && Object.keys(d.attrs).length > 0) {
                html += '<div class="mb-2"><span class="font-medium">Attributes:</span><ul class="mt-1">';
                
                for (const [key, value] of Object.entries(d.attrs)) {
                    html += '<li><span class="font-medium">' + key + ':</span> ' + value + '</li>';
                }
                
                html += '</ul></div>';
            }
            
            detailsContent.innerHTML = html;
            detailsPanel.classList.remove('hidden');
        }
        

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('counter');
            
            prevBtn.disabled = currentGraphIndex === 0;
            nextBtn.disabled = currentGraphIndex === graphData.length - 1;
            counter.textContent = (currentGraphIndex + 1) + ' / ' + graphData.length;
        }
        

        function updateNodeStats() {
            const graph = graphData[currentGraphIndex];
            const nodes = graph.nodes;
            
            let signalCount = 0;
            let evidenceCount = 0;
            let hypothesisCount = 0;
            
            for (const nodeId in nodes) {
                const node = nodes[nodeId];
                switch(node.type) {
                    case 'Signal': signalCount++; break;
                    case 'Evidence': evidenceCount++; break;
                    case 'Hypothesis': hypothesisCount++; break;
                }
            }
            
            const statsHtml = '<div class="mb-1">Total nodes: ' + Object.keys(nodes).length + '</div>' +
                             '<div class="mb-1">Signal Node: ' + signalCount + '</div>' +
                             '<div class="mb-1">Evidence Node: ' + evidenceCount + '</div>' +
                             '<div>Hypothesis Node: ' + hypothesisCount + '</div>';
            
            document.getElementById('nodeStats').innerHTML = statsHtml;
        }
        
        function setupEventListeners() {

            document.getElementById('prevBtn').addEventListener('click', function() {
                if (currentGraphIndex > 0) {
                    currentGraphIndex--;
                    loadGraph(currentGraphIndex);
                    updateNavigation();
                    updateNodeStats();
                    document.getElementById('nodeDetails').classList.add('hidden');
                }
            });
            
            document.getElementById('nextBtn').addEventListener('click', function() {
                if (currentGraphIndex < graphData.length - 1) {
                    currentGraphIndex++;
                    loadGraph(currentGraphIndex);
                    updateNavigation();
                    updateNodeStats();
                    document.getElementById('nodeDetails').classList.add('hidden');
                }
            });
            
  
            document.getElementById('zoomInBtn').addEventListener('click', function() {
                svg.transition().call(zoom.scaleBy, 1.3);
            });
            
            document.getElementById('zoomOutBtn').addEventListener('click', function() {
                svg.transition().call(zoom.scaleBy, 0.7);
            });
            
            document.getElementById('resetZoomBtn').addEventListener('click', function() {
                svg.transition().call(zoom.transform, d3.zoomIdentity);
            });
       
            window.addEventListener('resize', function() {
                const container = document.getElementById('graphContainer');
                width = container.clientWidth;
                height = container.clientHeight;
                
                svg.attr('width', width).attr('height', height);
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.alpha(0.3).restart();
            });
        }
        
  
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
