<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Graph Visualization</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        signal: '#ef4444',
                        evidence: '#22c55e',
                        hypothesis: '#f97316',
                        background: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .node-card {
                @apply p-3 rounded-lg shadow-md transition-all duration-300 cursor-pointer;
            }
            .node-card:hover {
                @apply shadow-lg transform -translate-y-1;
            }
            .signal-node {
                @apply bg-red-100 border-l-4 border-signal;
            }
            .evidence-node {
                @apply bg-green-100 border-l-4 border-evidence;
            }
            .hypothesis-node {
                @apply bg-orange-100 border-l-4 border-hypothesis;
            }
            .nav-button {
                @apply px-4 py-2 rounded-md bg-primary text-white hover:bg-blue-600 transition-colors duration-200;
            }
            .nav-button:disabled {
                @apply bg-gray-300 cursor-not-allowed;
            }
            .tooltip {
                @apply absolute bg-white p-2 rounded shadow-lg z-50 max-w-xs;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.2s;
            }
        }
    </style>
</head>
<body class="bg-background min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Causal graph</h1>
            <p class="text-gray-600">Causal graph</p>
        </header>

        <div class="flex flex-col lg:flex-row gap-6">

            <div class="lg:w-1/4 bg-white p-4 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Navi</h2>
                <div class="flex justify-between items-center mb-6">
                    <button id="prevBtn" class="nav-button">
                        <i class="fa fa-arrow-left mr-2"></i>Before
                    </button>
                    <span id="counter" class="text-lg font-medium text-gray-700">1 / 9</span>
                    <button id="nextBtn" class="nav-button">
                        Next<i class="fa fa-arrow-right ml-2"></i>
                    </button>
                </div>
                
                <div class="mb-6">
                    <h3 class="text-lg font-medium mb-2 text-gray-700">Legend</h3>
                    <div class="space-y-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-signal mr-2"></div>
                            <span>Signal (Signal)</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-evidence mr-2"></div>
                            <span>Evidence (Evidence)</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-hypothesis mr-2"></div>
                            <span>Hypothesis (Hypothesis)</span>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h3 class="text-lg font-medium mb-2 text-gray-700">statis</h3>
                    <div id="nodeStats" class="text-sm text-gray-600">
                    </div>
                </div>
            </div>
            
            <div class="lg:w-3/4 bg-white p-4 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="graphTitle" class="text-xl font-semibold text-gray-700">Causal graph 1</h2>
                    <div>
                        <button id="zoomInBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 mr-2">
                            <i class="fa fa-search-plus"></i>
                        </button>
                        <button id="zoomOutBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 mr-2">
                            <i class="fa fa-search-minus"></i>
                        </button>
                        <button id="resetZoomBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">
                            <i class="fa fa-refresh"></i>
                        </button>
                    </div>
                </div>
                

                <div id="graphContainer" class="border border-gray-200 rounded-lg h-[600px] overflow-hidden">
   
                </div>
                
       
                <div id="nodeDetails" class="mt-4 p-4 border border-gray-200 rounded-lg hidden">
                    <h3 class="text-lg font-medium mb-2 text-gray-700">Node</h3>
                    <div id="nodeDetailsContent">
                      
                    </div>
                </div>
            </div>
        </div>
    </div>

s", "score": 0.12, "attrs": {"why": "node-5 C1q/lambda granular deposits and node-2 young female support; node-6 no SLE/negative serology and node-3 negative autoantibodies refute.", "level": 1}}, "node-10": {"type": "Hypothesis", "label": "Podocytopathy/FSGS", "score": 0.15, "attrs": {"why": "node-4 podocyte swelling/FSGS, node-3 heavy proteinuria support; node-5 immune-complex capillary deposits refute primary podocytopathy.", "level": 1}}, "node-11": {"type": "Evidence", "label": "Electron microscopy and full secondary etiological workup for membranous nephropathy are unavailable, so primary versus secondary membranous nephropathy remains unconfirmed.", "score": 1.0, "attrs": {}}, "node-12": {"type": "Evidence", "label": "Serum THSD7A, C3/C4, hepatitis B/C, and anti-dsDNA testing are unavailable, limiting confirmation of primary versus secondary membranous nephropathy.", "score": 1.0, "attrs": {}}, "node-13": {"type": "Hypothesis", "label": "Primary membranous nephropathy", "score": 0.53, "attrs": {"why": "The pathologist now explicitly favors primary anti-PLA2R-negative membranous nephropathy, and both experts reaffirm that the absence of lupus, malignancy, infection and drug history argues against a secondary cause, which modestly strengthens the primary subtype. The atypical IgG1-dominant, IgG4-negative, PLA2R-negative deposits and the still-missing THSD7A/NELL-1, electron microscopy and secondary screens prevent a larger increase, so confidence rises slightly from 0.50 to 0.53.", "level": 1}}, "node-14": {"type": "Hypothesis", "label": "Secondary membranous nephropathy", "score": 0.15, "attrs": {"why": "Secondary membranous nephropathy is not fully excluded because HIV and syphilis serology, serum/urine immunofixation with free light chains, additional tumor markers, and NSAID/drug exposure history have not been obtained, as the laboratory physician emphasizes. The IgG1-dominant pattern with C1q and lambda deposition is also more characteristic of secondary than of classic primary membranous nephropathy. Still, lupus and malignancy are excluded and no infectious, drug, or rheumatic cause is documented, so secondary membranous nephropathy remains clearly less likely than primary, at a slightly raised 0.15.", "level": 1}}, "node-15": {"type": "Evidence", "label": "HIV and syphilis serology, serum and urine immunofixation with free light chains, additional tumor markers, and NSAID/drug exposure history have not been obtained.", "score": 1.0, "attrs": {}}, "node-16": {"type": "Evidence", "label": "The glomerular immune deposits are IgG1-dominant with negative IgG4 and negative anti-PLA2R in both serum and tissue, accompanied by C1q and lambda light-chain deposition.", "score": 1.0, "attrs": {}}, "node-17": {"type": "Hypothesis", "label": "Primary membranous nephropathy, anti-PLA2R-negative", "score": 0.45, "attrs": {"why": "The laboratory physician explicitly ranks anti-PLA2R-negative primary membranous nephropathy as the most suspicious subtype (0.45), consistent with the serum and tissue PLA2R negativity and the IgG1-dominant capillary-wall deposits, and specifically proposes that a THSD7A or other novel-antigen-driven process may be responsible. Because THSD7A/NELL-1/EXT1/EXT2/PCDH7 testing is still unavailable, confidence is maintained at 0.45.", "level": 2}}, "node-18": {"type": "Hypothesis", "label": "Secondary membranous nephropathy due to occult infection (e.g., hepatitis B, HIV, syphilis)", "score": 0.1, "attrs": {"why": "Current frontier is membranous nephropathy; the secondary subtype (node-14) remains possible (0.15) because infection workup is missing (nodes 12, 15). The IgG1-dominant, C1q/lambda-positive immune deposits (node-16) are more characteristic of secondary causes. This candidate refines secondary membranous nephropathy into a specific infectious etiology that is testable and could explain the atypical immunofluorescence pattern.", "level": 2}}, "node-19": {"type": "Hypothesis", "label": "Secondary me e-9", "type": "refute", "attrs": {}}, {"src": "node-4", "dst": "node-7", "type": "support", "attrs": {}}, {"src": "node-4", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-4", "dst": "node-10", "type": "support", "attrs": {}}, {"src": "node-5", "dst": "node-7", "type": "support", "attrs": {}}, {"src": "node-5", "dst": "node-9", "type": "support", "attrs": {}}, {"src": "node-5", "dst": "node-8", "type": "refute", "attrs": {}}, {"src": "node-5", "dst": "node-10", "type": "refute", "attrs": {}}, {"src": "node-6", "dst": "node-9", "type": "refute", "attrs": {}}, {"src": "node-6", "dst": "node-7", "type": "support", "attrs": {}}, {"src": "node-1", "dst": "node-13", "type": "refines", "attrs": {}}, {"src": "node-1", "dst": "node-14", "type": "refines", "attrs": {}}, {"src": "node-11", "dst": "node-14", "type": "support", "attrs": {}}, {"src": "node-12", "dst": "node-14", "type": "support", "attrs": {}}, {"src": "node-2", "dst": "node-13", "type": "support", "attrs": {}}, {"src": "node-4", "dst": "node-13", "type": "support", "attrs": {}}, {"src": "node-5", "dst": "node-13", "type": "support", "attrs": {}}, {"src": "node-6", "dst": "node-13", "type": "support", "attrs": {}}, {"src": "node-2", "dst": "node-14", "type": "refute", "attrs": {}}, {"src": "node-3", "dst": "node-14", "type": "refute", "attrs": {}}, {"src": "node-6", "dst": "node-14", "type": "refute", "attrs": {}}, {"src": "node-13", "dst": "node-7", "type": "support", "attrs": {}}, {"src": "node-14", "dst": "node-7", "type": "support", "attrs": {}}, {"src": "node-15", "dst": "node-14", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-7", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-14", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-13", "type": "refute", "attrs": {}}, {"src": "node-7", "dst": "node-17", "type": "refines", "attrs": {}}, {"src": "node-7", "dst": "node-18", "type": "refines", "attrs": {}}, {"src": "node-7", "dst": "node-19", "type": "refines", "attrs": {}}, {"src": "node-1", "dst": "node-21", "type": "refines", "attrs": {}}, {"src": "node-20", "dst": "node-17", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-21", "type": "support", "attrs": {}}, {"src": "node-17", "dst": "node-21", "type": "support", "attrs": {}}, {"src": "node-20", "dst": "node-21", "type": "support", "attrs": {}}], "start_signal_id": null}];
        let currentGraphIndex = 0;
        let svg, g, simulation, link, node;
        let width, height;
        let zoom;
        
       
        document.addEventListener('DOMContentLoaded', function() {
            initGraph();
            updateNavigation();
            updateNodeStats();
            setupEventListeners();
        });
        
       
        function initGraph() {
            const container = document.getElementById('graphContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
         
            svg = d3.select('#graphContainer')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
      
            zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', function(event) {
                    g.attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
      
            g = svg.append('g');
            
         
            loadGraph(currentGraphIndex);
        }
        
      
        function loadGraph(index) {
            const graph = graphData[index];
            
       
            document.getElementById('graphTitle').textContent = 'Causal graph ' + (index + 1);
            
      
            g.selectAll('*').remove();
            
       
            const nodes = [];
            for (const nodeId in graph.nodes) {
                if (graph.nodes.hasOwnProperty(nodeId)) {
                    nodes.push({
                        id: nodeId,
                        ...graph.nodes[nodeId]
                    });
                }
            }
            
 
            let links = (graph.edges || []).map(function(e) {
                return {
                    source: e.source || e.src,
                    target: e.target || e.dst,
                    type: e.type,
                    attrs: e.attrs || {}
                };
            });
            
           
            links = links.filter(function(link) {
                const sourceExists = nodes.some(function(n) { return n.id === link.source; });
                const targetExists = nodes.some(function(n) { return n.id === link.target; });
                
                if (!sourceExists) {
                    console.warn('Source node not found:', link.source);
                }
                if (!targetExists) {
                    console.warn('Target node not found:', link.target);
                }
                
                return sourceExists && targetExists;
            });
            
         
            simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(function(d) { return d.id; }).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(70));
            
  
            link = g.append('g')
                .attr('class', 'links')
                .selectAll('line')
                .data(links)
                .enter()
                .append('line')
                .attr('stroke-width', 2)
                .attr('stroke', function(d) { return getLinkColor(d.type); })
                .attr('stroke-opacity', 0.6);
            
  
            const nodeGroups = g.append('g')
                .attr('class', 'nodes')
                .selectAll('.node-group')
                .data(nodes)
                .enter()
                .append('g')
                .attr('class', 'node-group')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
    
            nodeGroups.append('circle')
                .attr('r', 20)
                .attr('fill', function(d) { return getNodeColor(d.type); })
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
        
            nodeGroups.append('text')
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .attr('fill', '#fff')
                .attr('font-size', '12px')
                .text(function(d) { return getNodeIcon(d.type); });
     
            nodeGroups.append('text')
                .attr('dy', 40)
                .attr('text-anchor', 'middle')
                .attr('fill', '#333')
                .attr('font-size', '12px')
                .text(function(d) { return truncateText(d.label, 20); });
            

            nodeGroups.on('click', showNodeDetails);
            
  
            nodeGroups.on('mouseover', function(event, d) {
                const tooltip = d3.select('#tooltip');
                tooltip.transition()
                    .duration(200)
                    .style('opacity', .9);
                tooltip.html(
                    '<div class="font-medium">' + d.type + ': ' + truncateText(d.label, 50) + '</div>' +
                    (d.score !== undefined ? '<div>Score: ' + d.score + '</div>' : '')
                )
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 28) + 'px');
            })
            .on('mouseout', function() {
                d3.select('#tooltip').transition()
                    .duration(500)
                    .style('opacity', 0);
            });
            
     
            simulation.on('tick', function() {
                link
                    .attr('x1', function(d) { return d.source.x; })
                    .attr('y1', function(d) { return d.source.y; })
                    .attr('x2', function(d) { return d.target.x; })
                    .attr('y2', function(d) { return d.target.y; });
                
                nodeGroups
                    .attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
            });
        }
        
 
        function getLinkColor(type) {
            switch(type) {
                case 'support': return '#22c55e'; 
                case 'refute': return '#ef4444'; 
                default: return '#999';
            }
        }

        function getNodeColor(type) {
            switch(type) {
                case 'Signal': return '#ef4444';
                case 'Evidence': return '#22c55e'; 
                case 'Hypothesis': return '#f97316'; 
                default: return '#64748b'; 
            }
        }
        

        function getNodeIcon(type) {
            switch(type) {
                case 'Signal': return 'S';
                case 'Evidence': return 'E';
                case 'Hypothesis': return 'H';
                default: return '?';
            }
        }
        

        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }
        

        function showNodeDetails(event, d) {
            const detailsPanel = document.getElementById('nodeDetails');
            const detailsContent = document.getElementById('nodeDetailsContent');
            
       
            let html = '<div class="mb-2"><span class="font-medium">Type:</span><span class="px-2 py-1 rounded text-white" style="background-color: ' + getNodeColor(d.type) + '">' + d.type + '</span></div>';
            html += '<div class="mb-2"><span class="font-medium"Label:</span><p class="mt-1">' + d.label + '</p></div>';
            
          
            if (d.score !== undefined) {
                html += '<div class="mb-2"><span class="font-medium">Confidence:</span><span>' + d.score + '</span></div>';
            }
            
           
            if (d.attrs && Object.keys(d.attrs).length > 0) {
                html += '<div class="mb-2"><span class="font-medium">Attributes:</span><ul class="mt-1">';
                
                for (const [key, value] of Object.entries(d.attrs)) {
                    html += '<li><span class="font-medium">' + key + ':</span> ' + value + '</li>';
                }
                
                html += '</ul></div>';
            }
            
            detailsContent.innerHTML = html;
            detailsPanel.classList.remove('hidden');
        }
        

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('counter');
            
            prevBtn.disabled = currentGraphIndex === 0;
            nextBtn.disabled = currentGraphIndex === graphData.length - 1;
            counter.textContent = (currentGraphIndex + 1) + ' / ' + graphData.length;
        }
        

        function updateNodeStats() {
            const graph = graphData[currentGraphIndex];
            const nodes = graph.nodes;
            
            let signalCount = 0;
            let evidenceCount = 0;
            let hypothesisCount = 0;
            
            for (const nodeId in nodes) {
                const node = nodes[nodeId];
                switch(node.type) {
                    case 'Signal': signalCount++; break;
                    case 'Evidence': evidenceCount++; break;
                    case 'Hypothesis': hypothesisCount++; break;
                }
            }
            
            const statsHtml = '<div class="mb-1">Total nodes: ' + Object.keys(nodes).length + '</div>' +
                             '<div class="mb-1">Signal Node: ' + signalCount + '</div>' +
                             '<div class="mb-1">Evidence Node: ' + evidenceCount + '</div>' +
                             '<div>Hypothesis Node: ' + hypothesisCount + '</div>';
            
            document.getElementById('nodeStats').innerHTML = statsHtml;
        }
        
        function setupEventListeners() {

            document.getElementById('prevBtn').addEventListener('click', function() {
                if (currentGraphIndex > 0) {
                    currentGraphIndex--;
                    loadGraph(currentGraphIndex);
                    updateNavigation();
                    updateNodeStats();
                    document.getElementById('nodeDetails').classList.add('hidden');
                }
            });
            
            document.getElementById('nextBtn').addEventListener('click', function() {
                if (currentGraphIndex < graphData.length - 1) {
                    currentGraphIndex++;
                    loadGraph(currentGraphIndex);
                    updateNavigation();
                    updateNodeStats();
                    document.getElementById('nodeDetails').classList.add('hidden');
                }
            });
            
  
            document.getElementById('zoomInBtn').addEventListener('click', function() {
                svg.transition().call(zoom.scaleBy, 1.3);
            });
            
            document.getElementById('zoomOutBtn').addEventListener('click', function() {
                svg.transition().call(zoom.scaleBy, 0.7);
            });
            
            document.getElementById('resetZoomBtn').addEventListener('click', function() {
                svg.transition().call(zoom.transform, d3.zoomIdentity);
            });
       
            window.addEventListener('resize', function() {
                const container = document.getElementById('graphContainer');
                width = container.clientWidth;
                height = container.clientHeight;
                
                svg.attr('width', width).attr('height', height);
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.alpha(0.3).restart();
            });
        }
        
  
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
