<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Graph Visualization</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        signal: '#ef4444',
                        evidence: '#22c55e',
                        hypothesis: '#f97316',
                        background: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .node-card {
                @apply p-3 rounded-lg shadow-md transition-all duration-300 cursor-pointer;
            }
            .node-card:hover {
                @apply shadow-lg transform -translate-y-1;
            }
            .signal-node {
                @apply bg-red-100 border-l-4 border-signal;
            }
            .evidence-node {
                @apply bg-green-100 border-l-4 border-evidence;
            }
            .hypothesis-node {
                @apply bg-orange-100 border-l-4 border-hypothesis;
            }
            .nav-button {
                @apply px-4 py-2 rounded-md bg-primary text-white hover:bg-blue-600 transition-colors duration-200;
            }
            .nav-button:disabled {
                @apply bg-gray-300 cursor-not-allowed;
            }
            .tooltip {
                @apply absolute bg-white p-2 rounded shadow-lg z-50 max-w-xs;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.2s;
            }
        }
    </style>
</head>

                <div class="mb-6">

                    <div class="space-y-2">

                <div>

                        <button id="resetZoomBtn" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">

                </div>

                    <div id="nodeDetailsContent">
                      
                    </div>
                </div>
            </div>

 2}}, "node-25": {"type": "Evidence", "label": "Skeletal survey shows bilateral optic canal narrowing (both optic canals involved)", "score": 1.0, "attrs": {}}, "node-26": {"type": "Evidence", "label": "Skeletal survey shows foot bone dysplasia in addition to hand dysplasia", "score": 1.0, "attrs": {}}, "node-27": {"type": "Hypothesis", "label": "Osteopetrosis", "score": 0.15, "attrs": {"why": "Osteopetrosis is a sclerosing skeletal dysplasia that can present with generalized osteosclerosis, cranial hyperostosis with optic canal narrowing/optic nerve compression, and brittle bones prone to fracture. The radiologist-confirmed cranial hyperostosis, rib and clavicle sclerosis, femoral hyperostosis with stress fractures, and bilateral optic canal narrowing are compatible. Confidence is kept low (0.15) because prominent diaphyseal hyperostosis with stress fractures and hand/foot dysplasia are not classic for osteopetrosis, and genetic confirmation is still pending.", "level": 2}}}, "edges": [{"src": "node-1", "dst": "node-7", "type": "refines", "attrs": {}}, {"src": "node-1", "dst": "node-8", "type": "refines", "attrs": {}}, {"src": "node-1", "dst": "node-9", "type": "refines", "attrs": {}}, {"src": "node-1", "dst": "node-10", "type": "refines", "attrs": {}}, {"src": "node-2", "dst": "node-9", "type": "refute", "attrs": {}}, {"src": "node-3", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-4", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-4", "dst": "node-9", "type": "support", "attrs": {}}, {"src": "node-4", "dst": "node-10", "type": "refute", "attrs": {}}, {"src": "node-5", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-5", "dst": "node-9", "type": "support", "attrs": {}}, {"src": "node-5", "dst": "node-7", "type": "refute", "attrs": {}}, {"src": "node-5", "dst": "node-10", "type": "refute", "attrs": {}}, {"src": "node-6", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-6", "dst": "node-9", "type": "support", "attrs": {}}, {"src": "node-6", "dst": "node-10", "type": "refute", "attrs": {}}, {"src": "node-1", "dst": "node-18", "type": "refines", "attrs": {}}, {"src": "node-1", "dst": "node-19", "type": "refines", "attrs": {}}, {"src": "node-11", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-11", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-11", "dst": "node-19", "type": "refute", "attrs": {}}, {"src": "node-11", "dst": "node-7", "type": "refute", "attrs": {}}, {"src": "node-12", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-12", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-12", "dst": "node-19", "type": "refute", "attrs": {}}, {"src": "node-12", "dst": "node-7", "type": "refute", "attrs": {}}, {"src": "node-12", "dst": "node-9", "type": "refute", "attrs": {}}, {"src": "node-13", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-13", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-14", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-14", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-14", "dst": "node-19", "type": "refute", "attrs": {}}, {"src": "node-14", "dst": "node-7", "type": "refute", "attrs": {}}, {"src": "node-14", "dst": "node-10", "type": "refute", "attrs": {}}, {"src": "node-15", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-15", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-7", "type": "refute", "attrs": {}}, {"src": "node-17", "dst": "node-9", "type": "support", "attrs": {}}, {"src": "node-6", "dst": "node-19", "type": "support", "attrs": {}}, {"src": "node-18", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-19", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-20", "dst": "node-8", "type": "support", "attrs": {}}, {"src": "node-20", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-20", "dst": "node-7", "type": "refute", "attrs": {}}, {"src": "node-20", "dst": "node-9", "type": "refute", "attrs": {}}, {"src": "node-20", "dst": "node-10", "type": "refute", "attrs": {}}, {"src": "node-20", "dst": "node-19", "type": "refute", "attrs": {}}, {"src": "node-8", "dst": "node-21", "type": "refines", "attrs": {}}, {"src": "node-8", "dst": "node-22", "type": "refines", "attrs": {}}, {"src": "node-8", "dst": "node-23", "type": "refines", "attrs": {}}, {"src": "node-8", "dst": "node-24", "type": "refines", "attrs": {}}, {"src": "node-1", "dst": "node-27", "type": "refines", "attrs": {}}, {"src": "node-25", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-26", "dst": "node-18", "type": "support", "attrs": {}}, {"src": "node-25", "dst": "node-27", "type": "support", "attrs": {}}, {"src": "node-11", "dst": "node-27", "type": "support", "attrs": {}}, {"src": "node-16", "dst": "node-27", "type": "support", "attrs": {}}, {"src": "node-18", "dst": "node-27", "type": "support", "attrs": {}}], "start_signal_id": null}];
        let currentGraphIndex = 0;
        let svg, g, simulation, link, node;
        let width, height;
        let zoom;
        
       
        document.addEventListener('DOMContentLoaded', function() {
            initGraph();
            updateNavigation();
            updateNodeStats();
            setupEventListeners();
        });
        
       
        function initGraph() {
            const container = document.getElementById('graphContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
         
            svg = d3.select('#graphContainer')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
      
            zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', function(event) {
                    g.attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
      
            g = svg.append('g');
            
         
            loadGraph(currentGraphIndex);
        }
        
      
        function loadGraph(index) {
            const graph = graphData[index];
            
       
            document.getElementById('graphTitle').textContent = 'Causal graph ' + (index + 1);
            
      
            g.selectAll('*').remove();
            
       
            const nodes = [];
            for (const nodeId in graph.nodes) {
                if (graph.nodes.hasOwnProperty(nodeId)) {
                    nodes.push({
                        id: nodeId,
                        ...graph.nodes[nodeId]
                    });
                }
            }
            
 
            let links = (graph.edges || []).map(function(e) {
                return {
                    source: e.source || e.src,
                    target: e.target || e.dst,
                    type: e.type,
                    attrs: e.attrs || {}
                };
            });
            
           
            links = links.filter(function(link) {
                const sourceExists = nodes.some(function(n) { return n.id === link.source; });
                const targetExists = nodes.some(function(n) { return n.id === link.target; });
                
                if (!sourceExists) {
                    console.warn('Source node not found:', link.source);
                }
                if (!targetExists) {
                    console.warn('Target node not found:', link.target);
                }
                
                return sourceExists && targetExists;
            });
            
         
            simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(function(d) { return d.id; }).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(70));
            
  
            link = g.append('g')
                .attr('class', 'links')
                .selectAll('line')
                .data(links)
                .enter()
                .append('line')
                .attr('stroke-width', 2)
                .attr('stroke', function(d) { return getLinkColor(d.type); })
                .attr('stroke-opacity', 0.6);
            
  
            const nodeGroups = g.append('g')
                .attr('class', 'nodes')
                .selectAll('.node-group')
                .data(nodes)
                .enter()
                .append('g')
                .attr('class', 'node-group')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
    
            nodeGroups.append('circle')
                .attr('r', 20)
                .attr('fill', function(d) { return getNodeColor(d.type); })
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
        
            nodeGroups.append('text')
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .attr('fill', '#fff')
                .attr('font-size', '12px')
                .text(function(d) { return getNodeIcon(d.type); });
     
            nodeGroups.append('text')
                .attr('dy', 40)
                .attr('text-anchor', 'middle')
                .attr('fill', '#333')
                .attr('font-size', '12px')
                .text(function(d) { return truncateText(d.label, 20); });
            

            nodeGroups.on('click', showNodeDetails);
            
  
            nodeGroups.on('mouseover', function(event, d) {
                const tooltip = d3.select('#tooltip');
                tooltip.transition()
                    .duration(200)
                    .style('opacity', .9);
                tooltip.html(
                    '<div class="font-medium">' + d.type + ': ' + truncateText(d.label, 50) + '</div>' +
                    (d.score !== undefined ? '<div>Score: ' + d.score + '</div>' : '')
                )
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 28) + 'px');
            })
            .on('mouseout', function() {
                d3.select('#tooltip').transition()
                    .duration(500)
                    .style('opacity', 0);
            });
            
     
            simulation.on('tick', function() {
                link
                    .attr('x1', function(d) { return d.source.x; })
                    .attr('y1', function(d) { return d.source.y; })
                    .attr('x2', function(d) { return d.target.x; })
                    .attr('y2', function(d) { return d.target.y; });
                
                nodeGroups
                    .attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
            });
        }
        
 
        function getLinkColor(type) {
            switch(type) {
                case 'support': return '#22c55e'; 
                case 'refute': return '#ef4444'; 
                default: return '#999';
            }
        }

        function getNodeColor(type) {
            switch(type) {
                case 'Signal': return '#ef4444';
                case 'Evidence': return '#22c55e'; 
                case 'Hypothesis': return '#f97316'; 
                default: return '#64748b'; 
            }
        }
        

        function getNodeIcon(type) {
            switch(type) {
                case 'Signal': return 'S';
                case 'Evidence': return 'E';
                case 'Hypothesis': return 'H';
                default: return '?';
            }
        }
        

        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }
        

        function showNodeDetails(event, d) {
            const detailsPanel = document.getElementById('nodeDetails');
            const detailsContent = document.getElementById('nodeDetailsContent');
            
       
            let html = '<div class="mb-2"><span class="font-medium">Type:</span><span class="px-2 py-1 rounded text-white" style="background-color: ' + getNodeColor(d.type) + '">' + d.type + '</span></div>';
            html += '<div class="mb-2"><span class="font-medium"Label:</span><p class="mt-1">' + d.label + '</p></div>';
            
          
            if (d.score !== undefined) {
                html += '<div class="mb-2"><span class="font-medium">Confidence:</span><span>' + d.score + '</span></div>';
            }
            
           
            if (d.attrs && Object.keys(d.attrs).length > 0) {
                html += '<div class="mb-2"><span class="font-medium">Attributes:</span><ul class="mt-1">';
                
                for (const [key, value] of Object.entries(d.attrs)) {
                    html += '<li><span class="font-medium">' + key + ':</span> ' + value + '</li>';
                }
                
                html += '</ul></div>';
            }
            
            detailsContent.innerHTML = html;
            detailsPanel.classList.remove('hidden');
        }
        

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('counter');
            
            prevBtn.disabled = currentGraphIndex === 0;
            nextBtn.disabled = currentGraphIndex === graphData.length - 1;
            counter.textContent = (currentGraphIndex + 1) + ' / ' + graphData.length;
        }
        

        function updateNodeStats() {
            const graph = graphData[currentGraphIndex];
            const nodes = graph.nodes;
            
            let signalCount = 0;
            let evidenceCount = 0;
            let hypothesisCount = 0;
            
            for (const nodeId in nodes) {
                const node = nodes[nodeId];
                switch(node.type) {
                    case 'Signal': signalCount++; break;
                    case 'Evidence': evidenceCount++; break;
                    case 'Hypothesis': hypothesisCount++; break;
                }
            }
            
            const statsHtml = '<div class="mb-1">Total nodes: ' + Object.keys(nodes).length + '</div>' +
                             '<div class="mb-1">Signal Node: ' + signalCount + '</div>' +
                             '<div class="mb-1">Evidence Node: ' + evidenceCount + '</div>' +
                             '<div>Hypothesis Node: ' + hypothesisCount + '</div>';
            
            document.getElementById('nodeStats').innerHTML = statsHtml;
        }
        
        function setupEventListeners() {

            document.getElementById('prevBtn').addEventListener('click', function() {
                if (currentGraphIndex > 0) {
                    currentGraphIndex--;
                    loadGraph(currentGraphIndex);
                    updateNavigation();
                    updateNodeStats();
                    document.getElementById('nodeDetails').classList.add('hidden');
                }
            });
            
            document.getElementById('nextBtn').addEventListener('click', function() {
                if (currentGraphIndex < graphData.length - 1) {
                    currentGraphIndex++;
                    loadGraph(currentGraphIndex);
                    updateNavigation();
                    updateNodeStats();
                    document.getElementById('nodeDetails').classList.add('hidden');
                }
            });
            
  
            document.getElementById('zoomInBtn').addEventListener('click', function() {
                svg.transition().call(zoom.scaleBy, 1.3);
            });
            
            document.getElementById('zoomOutBtn').addEventListener('click', function() {
                svg.transition().call(zoom.scaleBy, 0.7);
            });
            
            document.getElementById('resetZoomBtn').addEventListener('click', function() {
                svg.transition().call(zoom.transform, d3.zoomIdentity);
            });
       
            window.addEventListener('resize', function() {
                const container = document.getElementById('graphContainer');
                width = container.clientWidth;
                height = container.clientHeight;
                
                svg.attr('width', width).attr('height', height);
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.alpha(0.3).restart();
            });
        }
        
  
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
